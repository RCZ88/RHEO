<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#050506"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="rgba(255,255,255,0.16)"/>
  <!-- RHEO monogram: stylized 'ρ' (rho) — flow glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical stem of rho -->
    <line x1="26" y1="18" x2="26" y2="46"/>
    <!-- bowl of rho -->
    <path d="M26 24 C 26 18, 40 18, 40 26 C 40 34, 26 34, 26 34"/>
  </g>
  <!-- flow tail -->
  <path d="M26 46 C 30 52, 38 52, 42 46" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
</svg>
